[project]
name = "project-silver"
version = "0.1.0"
description = "Albion Online market data platform and dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.scripts]
silver = "silver.__main__:main"

[project.optional-dependencies]
eye = [
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "rapidocr-onnxruntime>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["silver"]  # the web pages and capture script inside it ship too
