[project]
name = "project-silver"
version = "0.1.0"
description = "Self-hosted Albion Online market, crafting and PvP dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xerostra" }]
keywords = ["albion-online", "market", "crafting", "flipping", "dashboard"]
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/xerostra/project-silver"
Issues = "https://github.com/xerostra/project-silver/issues"

[project.scripts]
silver = "silver.__main__:main"

[project.optional-dependencies]
eye = [  # OpenCV comes with rapidocr (opencv-python): a second OpenCV build would install cv2 twice
    "numpy>=2.2.6",
    "rapidocr-onnxruntime>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["silver"]  # the web pages and capture script inside it ship too
