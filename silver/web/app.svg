<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Project Silver: a silver coin with a gold line rising across it (silver, and profit).
       Drawn to stay legible down to 16 px: dark rim, mid-tone face, outlined line. -->
  <defs>
    <radialGradient id="face" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset=".5" stop-color="#b9c0cc"/>
      <stop offset="1" stop-color="#737d8e"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#3d4450"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#face)"/>
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#5b6474" stroke-opacity=".5" stroke-width="1.5"/>
  <!-- all outlines first, then all the gold, so line and arrowhead join without a seam -->
  <g stroke="#3a2a02" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 43 L28 31 L34 37 L45 25" fill="none" stroke-width="10"/>
    <path d="M36 21 L50 19 L48 33 Z" fill="#3a2a02" stroke-width="5"/>
  </g>
  <g fill="#f2c14e" stroke="#f2c14e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 43 L28 31 L34 37 L45 25" fill="none" stroke-width="6"/>
    <path d="M36 21 L50 19 L48 33 Z" stroke-width="1"/>
  </g>
</svg>
